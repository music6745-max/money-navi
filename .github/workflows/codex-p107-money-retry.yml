name: Codex P107 Money Patch Retry

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p107-money-retry.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply existing payload with permissive base64 decode
        shell: bash
        run: |
          sed -n "/<<'B64'/,/^          B64/p" .github/workflows/codex-p107-money.yml | sed '1d;$d' | base64 -di > /tmp/codex-p107.patch.gz
          gzip -dc /tmp/codex-p107.patch.gz > /tmp/codex-p107.patch
          git apply /tmp/codex-p107.patch
      - name: Commit patch and remove workflows
        shell: bash
        run: |
          git config user.name "codex-connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add 'src/app/guide/[slug]/contents/index.ts'
          git add 'src/app/guide/[slug]/contents/kaigo_p107_override.tsx'
          git add 'src/lib/guideFaqs.ts'
          git add 'src/lib/guides.ts'
          git add 'src/lib/kaigoProducts.ts'
          git rm '.github/workflows/codex-p107-money.yml'
          git rm '.github/workflows/codex-p107-money-retry.yml'
          git commit -m "fix: repair P107 care manager guide route"
          git push origin HEAD:master
