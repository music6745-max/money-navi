name: Codex P107 Money Source Script
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/codex-p107-money-script.yml
permissions:
  contents: write
concurrency:
  group: codex-p107-money-source-script
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply P107 money source updates
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function read(file) {
            return fs.readFileSync(file, "utf8");
          }

          function write(file, content) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, content);
          }

          const overridePath = "src/app/guide/[slug]/contents/kaigo_p107_override.tsx";
          const overrideContent = String.raw`import type { ReactNode } from "react";
          import { KaigoActionBox } from "./helpers";

          export const guideContentsP107Override: Record<string, ReactNode> = {
            "care-manager-first-consultation-family-memo": (
              <>
                <section>
                  <h2 className="mb-3 text-xl font-bold">初回相談は「困っていること」を短く渡せる形にする</h2>
                  <p>
                    ケアマネジャーや地域包括支援センターへ初めて相談するとき、家族が制度名やサービス名を正確に知っている必要はありません。
                    先に整理したいのは、親の暮らしで何が変わったか、家族がどこで困っているか、本人が何を嫌がっているかです。
                  </p>
                  <p>
                    相談の場で全てを決めようとすると、本人の希望、家族の都合、費用不安、通院や服薬の話が混ざりやすくなります。
                    生活状況、困りごと、家族の支援、費用と連絡体制を分けて持っていくと、次に確認する窓口や準備物が見えやすくなります。
                  </p>
                </section>

                <section>
                  <h2 className="mb-3 text-xl font-bold">家族で先に書いておきたい4つの欄</h2>
                  <ul className="list-inside list-disc space-y-2 text-sm text-muted">
                    <li>生活状況: 食事、入浴、着替え、買い物、掃除、通院、外出の様子</li>
                    <li>困りごと: 転倒、物忘れ、電話に出ない、説明が伝わらない、支払い忘れなど</li>
                    <li>家族の支援: 近くで動ける人、遠方から連絡できる人、記録を残す人</li>
                    <li>費用と連絡体制: 支払いの不安、領収書の保管、緊急時の連絡順</li>
                  </ul>
                </section>

                <section>
                  <h2 className="mb-3 text-xl font-bold">できる日とできない日の差を残す</h2>
                  <p>
                    相談時に伝わりやすいのは、「普段はできるが疲れている日はできない」「電話では元気そうだが家に行くと片付いていない」
                    といった差です。大きな判断より、日付、場面、家族が見た事実を1行で残すほうが、本人を責める印象も弱くなります。
                  </p>
                  <p>
                    記憶違いで揉めないよう、見たことと聞いたことを分けてメモします。医療、介護制度、税金、契約の判断はこのメモだけで決めず、
                    自治体、相談窓口、医療機関、専門家の案内に沿って確認してください。
                  </p>
                </section>

                <section>
                  <h2 className="mb-3 text-xl font-bold">相談前に家族内で仮決めすること</h2>
                  <ul className="list-inside list-disc space-y-2 text-sm text-muted">
                    <li>相談窓口へ連絡する人と、相談結果を家族へ共有する人</li>
                    <li>本人へ事前にどう説明するか、相談に同席するかどうか</li>
                    <li>通院、買い物、書類、支払い確認のうち家族が担える範囲</li>
                    <li>費用の立替が出た場合の記録方法と領収書の保管担当</li>
                    <li>相談後に次回まで確認することと、まだ決めないこと</li>
                  </ul>
                </section>

                <KaigoActionBox
                  toolHref="https://net-toolbox.jp/tools/kaigo-care-manager-first-consult-memo?utm_source=toshi-navi&utm_medium=guide&utm_campaign=care_manager_first_consult"
                  toolLabel="初回相談メモを無料で作る"
                  boothHref="https://kaigo-okane.booth.pm/items/8424688"
                  boothLabel="ケアマネ初回相談テンプレートを見る"
                >
                  <p>
                    まず無料ツールで相談前に伝えること、家族の役割、聞きたいことを整理します。継続して残す段階では、
                    BOOTHのテンプレートに転記すると、生活状況、困りごと、質問メモを同じ形式で見返しやすくなります。
                  </p>
                </KaigoActionBox>
              </>
            ),
          };
          `;
          write(overridePath, overrideContent.replace(/^ {10}/gm, ""));

          const indexPath = "src/app/guide/[slug]/contents/index.ts";
          let index = read(indexPath);
          if (!index.includes("guideContentsP107Override")) {
            index = index.replace(
              'import { guideContentsPart06 } from "./kaigo_part_06";\n',
              'import { guideContentsPart06 } from "./kaigo_part_06";\nimport { guideContentsP107Override } from "./kaigo_p107_override";\n'
            );
            index = index.replace(
              "  ...guideContentsPart06,\n",
              "  ...guideContentsPart06,\n  ...guideContentsP107Override,\n"
            );
            write(indexPath, index);
          }

          const productsPath = "src/lib/kaigoProducts.ts";
          let products = read(productsPath);
          if (!products.includes("rawKaigoProducts")) {
            products = products.replace(
              "export const kaigoProducts: KaigoProduct[] = [",
              "const rawKaigoProducts: KaigoProduct[] = ["
            );
          }
          if (!products.includes("kaigoProductOverrides")) {
            products = products.replace(
              "\nexport const kaigoSituations: KaigoSituation[] = [",
              `
          const kaigoProductOverrides: Record<string, Partial<KaigoProduct>> = {
            p107: {
              title: "ケアマネ初回相談前の生活状況・困りごと整理テンプレート集",
              description:
                "ケアマネや地域包括支援センターへ初めて相談する前に、生活状況、困りごと、家族の役割、質問メモを整理するPDF/Excelセット。",
              priceLabel: "単品 1,480円",
              tags: ["ケアマネ", "初回相談", "困りごと整理"],
            },
          };

          export const kaigoProducts: KaigoProduct[] = rawKaigoProducts.map((product) => ({
            ...product,
            ...(kaigoProductOverrides[product.id] ?? {}),
          }));

          export const kaigoSituations: KaigoSituation[] = [`
            );
          }
          write(productsPath, products.replace(/^ {10}/gm, ""));

          const guidesPath = "src/lib/guides.ts";
          let guides = read(guidesPath);
          if (!guides.includes("rawGuides")) {
            guides = guides.replace("export const guides: Guide[] = [", "const rawGuides: Guide[] = [");
          }
          if (!guides.includes("guideOverrides")) {
            guides = guides.replace(
              "\nexport function getGuideBySlug(slug: string) {",
              `
          const guideOverrides: Record<string, Partial<Guide>> = {
            "care-manager-first-consultation-family-memo": {
              title: "ケアマネに初回相談するとき家族が持っていくメモ",
              description:
                "ケアマネや地域包括支援センターへ初めて相談する前に、生活状況、困りごと、家族の役割、費用不安を整理して伝える準備を解説。",
              icon: "🗒️",
              readTime: "9分",
            },
          };

          export const guides: Guide[] = rawGuides.map((guide) => ({
            ...guide,
            ...(guideOverrides[guide.slug] ?? {}),
          }));

          export function getGuideBySlug(slug: string) {`
            );
          }
          write(guidesPath, guides.replace(/^ {10}/gm, ""));

          const faqsPath = "src/lib/guideFaqs.ts";
          let faqs = read(faqsPath);
          if (!faqs.includes("rawGuideFaqs")) {
            faqs = faqs.replace(
              "export const guideFaqs: Record<string, FAQ[]> = {",
              "const rawGuideFaqs: Record<string, FAQ[]> = {"
            );
          }
          if (!faqs.includes("guideFaqOverrides")) {
            faqs = faqs.replace(
              "\nexport function getFaqsForGuide(slug: string): FAQ[] {",
              `
          const guideFaqOverrides: Record<string, FAQ[]> = {
            "care-manager-first-consultation-family-memo": [
              {
                question: "ケアマネへの初回相談では何を持っていけばよいですか？",
                answer:
                  "本人の生活状況、困っている場面、通院や服薬、家族ができる支援、費用面の不安を1枚にまとめて持っていくと話を進めやすくなります。保険証番号や口座情報などの個人情報は、必要な場面で相談窓口の案内に沿って扱います。",
              },
              {
                question: "本人がまだ介護サービスを嫌がっている場合も相談できますか？",
                answer:
                  "相談できます。いきなりサービス利用を決めるのではなく、家族が見ている困りごと、本人が嫌がっている理由、今は困っていないことを分けて伝えると、無理のない提案を確認しやすくなります。",
              },
              {
                question: "家族の意見がまとまっていない時はどうすればよいですか？",
                answer:
                  "結論をそろえるより先に、誰が連絡係か、誰が通院や買い物を手伝えるか、費用の記録を誰が残すかを仮で決めます。未決事項もそのままメモに残して、相談時に確認したいこととして持っていくのが現実的です。",
              },
            ],
          };

          export const guideFaqs: Record<string, FAQ[]> = {
            ...rawGuideFaqs,
            ...guideFaqOverrides,
          };

          export function getFaqsForGuide(slug: string): FAQ[] {`
            );
          }
          write(faqsPath, faqs.replace(/^ {10}/gm, ""));

          for (const file of [
            ".github/workflows/codex-p107-money.yml",
            ".github/workflows/codex-p107-money-retry.yml",
            ".github/workflows/codex-p107-money-script.yml",
          ]) {
            if (fs.existsSync(file)) fs.rmSync(file);
          }
          NODE
      - name: Commit P107 money source updates
        run: |
          git config user.name "Codex Automation"
          git config user.email "codex-automation@example.com"
          git add src/app/guide/[slug]/contents/index.ts src/app/guide/[slug]/contents/kaigo_p107_override.tsx src/lib/kaigoProducts.ts src/lib/guides.ts src/lib/guideFaqs.ts .github/workflows
          git diff --cached --quiet || git commit -m "fix: repair P107 care manager guide route"
          git push origin HEAD:master
