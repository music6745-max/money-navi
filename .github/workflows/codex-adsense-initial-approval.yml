name: Codex AdSense Initial Approval Patch

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/codex-adsense-initial-approval.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply AdSense initial approval patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/music6745-max/money-navi/0d35e6ebeabd66d723fdd4c472e06d2eab551597/.github/workflows/codex-adsense-initial-approval.yml" -o /tmp/old-workflow.yml
          python3 - <<'PY'
          import base64, gzip, re
          from pathlib import Path

          text = Path("/tmp/old-workflow.yml").read_text(encoding="utf-8")
          match = re.search(r"printf '%s' '([^']+)'", text)
          if not match:
              raise SystemExit("patch payload not found")

          data = gzip.decompress(base64.b64decode(match.group(1)))
          if data.startswith(b"\xef\xbb\xbf"):
              data = data[3:]
          data = data.replace(b"\r\n", b"\n")
          Path("/tmp/adsense_initial_approval.patch").write_bytes(data)
          PY
          git apply --ignore-space-change --ignore-whitespace --whitespace=nowarn /tmp/adsense_initial_approval.patch
          rm .github/workflows/codex-adsense-initial-approval.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/about/page.tsx src/app/editorial-policy/page.tsx 'src/app/guide/[slug]/BasePage.tsx' 'src/app/guide/[slug]/GuideContent.tsx' src/app/layout.tsx src/app/sitemap.ts src/components/JsonLd.tsx src/lib/guides.ts .github/workflows/codex-adsense-initial-approval.yml
          git commit -m "feat: harden adsense initial approval signals"
          git push
