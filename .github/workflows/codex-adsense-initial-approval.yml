name: Codex AdSense Initial Approval Patch

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/codex-adsense-initial-approval.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply AdSense initial approval patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/adsense_initial_approval.patch
          git apply --whitespace=nowarn /tmp/adsense_initial_approval.patch
          rm .github/workflows/codex-adsense-initial-approval.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/about/page.tsx src/app/editorial-policy/page.tsx 'src/app/guide/[slug]/BasePage.tsx' 'src/app/guide/[slug]/GuideContent.tsx' src/app/layout.tsx src/app/sitemap.ts src/components/JsonLd.tsx src/lib/guides.ts .github/workflows/codex-adsense-initial-approval.yml
          git commit -m "feat: harden adsense initial approval signals"
          git push
