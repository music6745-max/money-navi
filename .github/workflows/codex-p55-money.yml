name: Codex P55 Money Patch

on:
  push:
    branches:
      - master
    paths:
      - codex_p55_money.patch
      - .github/workflows/codex-p55-money.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P55 patch
        shell: bash
        run: |
          git apply --whitespace=nowarn codex_p55_money.patch
          rm codex_p55_money.patch .github/workflows/codex-p55-money.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/kaigoProducts.ts src/lib/guides.ts src/lib/guideFaqs.ts 'src/app/guide/[slug]/page.tsx' 'src/app/guide/[slug]/contents/kaigo_part_06.tsx' src/app/kaigo/page.tsx codex_p55_money.patch .github/workflows/codex-p55-money.yml
          git commit -m "feat: connect P55 hair salon memo"
          git push
