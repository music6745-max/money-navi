name: Apply P66 money source

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay original P66 money apply script
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/p66-money-trigger.txt || true
          git show e0be1881f845dbaab0857c2015cc088937e895ba:.github/workflows/apply-p66-money.yml |
            awk 'found { sub(/^          /, ""); print } /        run: \|/ { found=1 }' > /tmp/apply-p66-money.sh
          bash /tmp/apply-p66-money.sh
