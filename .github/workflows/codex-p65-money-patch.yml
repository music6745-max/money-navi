name: Codex P65 money patch
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p65-money-patch.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply verified P65 patch from previous workflow payload
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/codex-p65-money-patch.yml \
            | awk '/^H4s/{flag=1} /^PATCH_B64$/{flag=0} flag{print}' > /tmp/p65_money.patch.tgz.b64
          test -s /tmp/p65_money.patch.tgz.b64
          base64 -d /tmp/p65_money.patch.tgz.b64 > /tmp/p65_money.patch.tgz
          tar -xzf /tmp/p65_money.patch.tgz -C /tmp
          git apply --whitespace=nowarn /tmp/p65_money.patch
          rm .github/workflows/codex-p65-money-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/app/guide/parent-cherished-item-background-record/page.tsx src/app/kaigo/layout.tsx src/app/sitemap.ts src/lib/guideFaqs.ts src/lib/guides.ts src/lib/kaigoProducts.ts .github/workflows/codex-p65-money-patch.yml
          git commit -m "feat: connect P65 cherished item kaigo guide"
          git push
