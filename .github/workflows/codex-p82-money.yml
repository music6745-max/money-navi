name: Codex P82 money patch

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/codex-p82-money.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Codex patch
        shell: bash
        run: |
          cat > /tmp/codex-p82.patch.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/codex-p82.patch.b64 > /tmp/codex-p82.patch
          git apply --index /tmp/codex-p82.patch
          git rm .github/workflows/codex-p82-money.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add P82 entrance footwear guide"
          git push
