          const fs = require('fs');

          function edit(path, fn) {
            const before = fs.readFileSync(path, 'utf8');
            const after = fn(before);
            if (after !== before) fs.writeFileSync(path, after);
          }
          function insertBefore(path, marker, block, unique) {
            edit(path, (s) => {
              if (unique && s.includes(unique)) return s;
              const i = s.indexOf(marker);
              if (i < 0) throw new Error(`marker not found in ${path}: ${marker.slice(0, 80)}`);
              return s.slice(0, i) + block + s.slice(i);
            });
          }
          function insertAfter(path, marker, block, unique) {
            edit(path, (s) => {
              if (unique && s.includes(unique)) return s;
              const i = s.indexOf(marker);
              if (i < 0) throw new Error(`marker not found in ${path}: ${marker.slice(0, 80)}`);
              return s.slice(0, i + marker.length) + block + s.slice(i + marker.length);
            });
          }
          function replaceOnce(path, from, to) {
            edit(path, (s) => {
              if (s.includes(to)) return s;
              if (!s.includes(from)) throw new Error(`replace marker not found in ${path}`);
              return s.replace(from, to);
            });
          }

