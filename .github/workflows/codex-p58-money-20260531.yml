            <>
              <section>
                <h2 className="text-xl font-bold mb-3">実家に何が届いているかは、口頭だけだと引き継ぎにくい</h2>
                <p>
                  新聞、牛乳、食材宅配、通販の定期便など、実家に定期的に届くものは、親本人や同居家族だけが何となく覚えている状態になりがちです。
