          replaceOnce(productPath, 'productIds: ["p57", "p56", "p55", "p54", "p52",', 'productIds: ["p58", "p57", "p56", "p55", "p54", "p52",');
          replaceOnce(productPath, 'productIds: ["p56", "p55", "p42",', 'productIds: ["p58", "p56", "p55", "p42",');
          replaceOnce(productPath, 'productIds: ["p57", "p55", "p27",', 'productIds: ["p58", "p57", "p55", "p27",');

