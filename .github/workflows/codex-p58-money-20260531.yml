name: Codex P58 Money Patch

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply P58 money-navi changes
        shell: bash
        run: |
          set -euo pipefail
          cat > apply-p58-money.js <<'NODE'
          const fs = require("fs");

          function read(path) {
            return fs.readFileSync(path, "utf8");
          }

          function write(path, text) {
            fs.writeFileSync(path, text, "utf8");
          }

          function insertBefore(path, marker, block, guard) {
            let text = read(path);
            if (text.includes(guard)) return;
            if (!text.includes(marker)) throw new Error(`Marker not found in ${path}: ${marker}`);
            text = text.replace(marker, `${block}${marker}`);
            write(path, text);
          }

          function replaceOnce(path, search, replacement) {
            let text = read(path);
            if (text.includes(replacement)) return;
            if (!text.includes(search)) throw new Error(`Search not found in ${path}: ${search}`);
            text = text.replace(search, replacement);
            write(path, text);
          }

          insertBefore(
            "src/lib/kaigoProducts.ts",
            '  {\n    id: "p35",',
            `  {
            id: "p58",
            type: "single",
            title: "実家に届く 定期便・宅配便 受け取りメモ テンプレート集",
