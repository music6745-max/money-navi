name: codex-p64-money

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p64-money.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified P64 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p64-money.patch <<'PATCH'
