name: Codex AdSense Traffic Patch 20260520

"on":
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply content edits
        shell: bash
        run: |
          cat > /tmp/codex-money-patch.js <<'NODE'
          const fs = require('fs');

          function normalize(text) {
            return text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n');
          }

          function replaceOnce(text, search, replacement, label) {
            const count = text.split(search).length - 1;
            if (count !== 1) {
              throw new Error(`${label}: expected 1 match, found ${count}`);
            }
            return text.replace(search, replacement);
          }

          const guidePath = 'src/app/guide/[slug]/GuideContent.tsx';
          const guidesPath = 'src/lib/guides.ts';
          let guide = normalize(fs.readFileSync(guidePath, 'utf8'));
          let guides = normalize(fs.readFileSync(guidesPath, 'utf8'));

          guide = replaceOnce(
            guide,
          `type PageAwareProps = {
            page?: string;
            children?: ReactNode;
          };

          function withDefaultPage`,
          `type PageAwareProps = {
            page?: string;
            children?: ReactNode;
          };

          function DecisionBox({
            title,
            points,
            note,
          }: {
            title: string;
            points: string[];
            note?: string;
          }) {
            return (
              <section className="rounded-xl border border-primary/30 bg-primary/5 p-5">
                <h2 className="text-lg font-bold mb-3">{title}</h2>
                <ul className="list-disc list-inside space-y-2 text-sm text-muted">
                  {points.map((point) => (
                    <li key={point}>{point}</li>
                  ))}
                </ul>
                {note && <p className="text-xs text-muted mt-3">{note}</p>}
              </section>
            );
          }

          function withDefaultPage`,
            'insert DecisionBox'
          );

          guide = replaceOnce(
            guide,
          `          自動車保険は、ネット型（ダイレクト型）と代理店型で年間保険料に2〜5万円の差が出るのが通常。代理店型の人件費・店舗維持費が保険料に上乗せされているため、ネットで完結する型のほうが断然お得です。例えば30代・6S等級・軽自動車なら、代理店型 年8万円 vs ネット型 年5万円と、年3万円の差に。`,
          `          自動車保険は、ネット型（ダイレクト型）と代理店型で年間保険料に差が出ることがあります。代理店型は対面相談の安心感があり、ネット型は申込みや更新を自分で進める代わりに保険料を抑えやすいのが特徴です。例えば30代・6S等級・軽自動車なら、条件によって年数万円の差が出るケースもあります。`,
            'soften auto insurance intro'
          );

          guide = replaceOnce(
            guide,
          `          <li>事故対応品質は両者大差なし（損保ジャパン・東京海上の再保険会社と連携）</li>`,
          `          <li>事故対応は会社ごとに差があるため、受付時間・初期対応・ロードサービス範囲を確認</li>`,
            'soften accident support claim'
          );

          guide = replaceOnce(
            guide,
          `      />
                <section>
                  <h2 className="text-xl font-bold mb-3">一括見積もりサービスで最安値を見つける</h2>`,
          `      />
                <DecisionBox
                  title="結論：満期前に3社以上を同条件で比べる"
                  points={[
                    "保険料だけでなく、対人・対物無制限、人身傷害、弁護士費用特約の有無を同じ条件で比較する。",
                    "車両保険は車の時価と貯蓄額で判断し、古い車では外す候補にする。",
                    "一括見積もりは乗換先を決める前の候補出しに向き、個別見積もりは最終確認に向く。",
                  ]}
                  note="代理店型からネット型へ変える場合も、事故時の連絡方法・ロードサービス範囲・家族の運転条件は必ず確認します。"
                />
                <section>
                  <h2 className="text-xl font-bold mb-3">一括見積もりサービスで最安値を見つける</h2>`,
            'insert auto insurance decision box'
          );

          guide = replaceOnce(
            guide,
          `      />
                <section>
                  <h2 className="text-xl font-bold mb-3">ディーラーローン vs 銀行ローンの総返済額比較</h2>`,
          `      />
                <DecisionBox
                  title="結論：車の支払いはローン金利と保険料をセットで見る"
                  points={[
                    "銀行ローンの仮審査を先に取り、ディーラー提示金利との差額を総返済額で比較する。",
                    "購入後は自動車保険・税金・燃料費も固定費になるため、ローンだけで月額を判断しない。",
                    "ローン候補が決まったら、納車前に自動車保険の一括見積もりも取り、初年度の総コストを確定させる。",
                  ]}
                  note="車両価格が同じでも、金利と保険料の組み合わせで年間負担は大きく変わります。"
                />
                <section>
                  <h2 className="text-xl font-bold mb-3">ディーラーローン vs 銀行ローンの総返済額比較</h2>`,
            'insert auto loan decision box'
          );

          guide = replaceOnce(
            guide,
          `      />
                <section>
                  <h2 className="text-xl font-bold mb-3">バイク保険選びの5つのポイント</h2>`,
          `      />
                <DecisionBox
                  title="結論：バイク保険は対物無制限とロードサービスを先に見る"
                  points={[
                    "任意保険は対人・対物無制限を基本にし、弁護士費用特約と人身傷害の有無を確認する。",
                    "通勤や長距離ツーリングに使う人は、レッカー無料距離と夜間対応を重視する。",
                    "車も所有している場合は、自動車保険も満期前に見直すと固定費削減の余地が広がる。",
                  ]}
                  note="バイク保険と自動車保険は別契約でも、家計上は同じ交通費・保険料としてまとめて管理します。"
                />
                <section>
                  <h2 className="text-xl font-bold mb-3">バイク保険選びの5つのポイント</h2>`,
            'insert bike insurance decision box'
          );

          guide = replaceOnce(
            guide,
          `      />
                <section>
                  <h2 className="text-xl font-bold mb-3">保険料節約の5つのポイント</h2>`,
          `      />
                <DecisionBox
                  title="結論：保険会社名で選ぶ前に条件をそろえる"
                  points={[
                    "現在の等級、年齢条件、運転者範囲、年間走行距離をそろえると、保険料差の理由が見えやすい。",
                    "最初に一括見積もりで候補を広げ、上位2〜3社だけ補償内容を細かく確認する。",
                    "満期直前では選択肢が狭くなるため、更新日の1〜2か月前に見積もりを取る。",
                  ]}
                  note="事故対応やロードサービスの違いは、保険料の安さだけでは比較できないため、補償条件と一緒に確認します。"
                />
                <section>
                  <h2 className="text-xl font-bold mb-3">保険料節約の5つのポイント</h2>`,
            'insert car insurance compare decision box'
          );

          guide = replaceOnce(
            guide,
          `          スイングトレードは、数日〜数週間保有する中期トレード戦略。デイトレより時間的余裕があり、会社員・個人投資家にも実践可能。移動平均線・MACD・RSI等のテクニカル指標、銘柄選定（出来高・時価総額・ボラティリティ）、ストップロス設定、月利3〜5%のリターン目標。年率40%超の実績も可能な、コスパ良い投資スタイルです。`,
          `          スイングトレードは、数日〜数週間保有する中期トレード戦略です。デイトレより時間的余裕がありますが、短期売買である以上、損失管理が欠かせません。移動平均線・MACD・RSI等のテクニカル指標、出来高、時価総額、ボラティリティを確認し、損切り幅と利確条件を先に決めてから取引することが重要です。`,
            'soften swing trading intro'
          );

          guide = replaceOnce(
            guide,
          `        description="SBI証券で国内株＋米国株のスイングトレード、両市場の手数料無料＋テクニカル分析ツール充実。業界No.1の情報量で、初心者〜上級者まで月利3〜5%を目指せる環境。"`,
          `        description="SBI証券なら国内株と米国株の取引環境、テクニカル分析ツール、マーケット情報をまとめて確認できます。短期売買では損失管理が重要なため、取引前に手数料・注文方法・リスクを確認しましょう。"`,
            'soften swing trading CTA'
          );

          guide = replaceOnce(
            guide,
          `      />
                <section>
                  <h2 className="text-xl font-bold mb-3">EV購入の総合的メリット</h2>`,
          `      />
                <DecisionBox
                  title="結論：補助金で購入費を下げた後は維持費を確認する"
                  points={[
                    "EV・PHEVは車両価格や修理費が保険料に反映されるため、補助金額だけで判断しない。",
                    "自治体補助金は予算枠や受付期限があるため、購入前に公式情報で申請条件を確認する。",
                    "納車時期が見えたら自動車保険の見積もりも取り、ローン・電気代・保険料の月額を合算する。",
                  ]}
                  note="購入補助と維持費の両方を見れば、ガソリン車との実質差額を判断しやすくなります。"
                />
                <section>
                  <h2 className="text-xl font-bold mb-3">EV購入の総合的メリット</h2>`,
            'insert eco car decision box'
          );

          for (const [label, from, to] of [
            ['auto loan title', 'title: "【2026年】自動車ローン比較10選｜金利1%台から始める賢い車購入",', 'title: "自動車ローン金利比較2026｜銀行・ディーラー・残価設定の総返済額",'],
            ['auto loan desc', 'description: "銀行自動車ローン（住信SBI/楽天/東京スター）vsディーラーローンを金利・審査スピード・保証料で徹底比較。年利1.5〜3.0%台の低金利ローン選定で総返済額を50万円以上節約。",', 'description: "銀行マイカーローン、ディーラーローン、残価設定型を金利・審査・保証料・総返済額で比較。車購入前に確認したい低金利ローンと自動車保険の見直しも解説。",'],
            ['foreign tax title', 'title: "【2026年】外国税額控除完全ガイド｜米国株配当で二重課税を取り戻す方法",', 'title: "外国税額控除のやり方｜米国株・米国ETF配当の確定申告ガイド",'],
            ['foreign tax desc', 'description: "米国株・米国ETFの配当金にかかる米国源泉税10%を、日本の確定申告で外国税額控除として取り戻す手続きを解説。計算方法・申告書記載例・必要書類まで網羅。",', 'description: "米国株や米国ETFの配当にかかる米国源泉税10%を、確定申告の外国税額控除で調整する流れを解説。対象者、計算例、必要書類、e-Tax入力の注意点を整理。",'],
            ['japanese stock title', 'title: "【2026年】日本株おすすめランキング10選｜時価総額・成長性・配当で選ぶ",', 'title: "【2026年】日本株おすすめ銘柄10選｜新NISAで見る成長株・高配当株",'],
            ['japanese stock desc', 'description: "2026年の日本株投資で注目すべき10銘柄を厳選。トヨタ・ソニー・任天堂・三菱UFJ・武田薬品等、時価総額・成長性・配当利回りで徹底比較。新NISA成長枠での活用法。",', 'description: "2026年に注目したい日本株10銘柄を、新NISA成長投資枠・配当利回り・時価総額・業績テーマで比較。三菱UFJ、NTT、トヨタなどの見方と注意点を整理。",'],
            ['pet insurance title', 'title: "【2026年】ペット保険詳細比較｜犬猫の医療費を50〜70%カバーする10社ランキング",', 'title: "ペット保険比較2026｜犬猫の通院・手術・窓口精算で選ぶ",'],
            ['pet insurance desc', 'description: "ペット保険10社比較（アニコム・アイペット・ipet・FPC・楽天等）。補償割合50〜70%、月額1000〜5000円、手術・入院・通院カバー範囲、加入年齢制限、新規加入のコツまで。",', 'description: "アニコム、アイペット、FPC、楽天などのペット保険を、補償割合、通院・入院・手術、窓口精算、加入年齢、月額保険料で比較。犬猫の医療費に備える選び方を解説。",'],
            ['swing title', 'title: "【2026年】スイングトレード完全ガイド｜数日〜数週間の中期戦略で月利5%",', 'title: "スイングトレードの始め方｜銘柄選定・損切り・利確ルールを解説",'],
            ['swing desc', 'description: "スイングトレードの基本。移動平均線・MACD・RSI等のテクニカル指標、銘柄選定（出来高・時価総額・ボラティリティ）、ストップロス設定、月利3〜5%のリターン目標まで。",', 'description: "数日〜数週間で売買するスイングトレードの基礎を、移動平均線・MACD・RSI・出来高の見方、銘柄選定、損切り、利確ルールまで初心者向けに整理。",'],
            ['bitcoin ETF title', 'title: "【2026年】ビットコイン現物ETF日本上陸予測｜IBIT・FBTC等の米国状況",', 'title: "ビットコインETFは日本で買える？米国ETF・税金・代替手段を解説",'],
            ['bitcoin ETF desc', 'description: "米国SEC承認のビットコイン現物ETF（IBIT・FBTC等）の概要と日本上陸予測。ブラックロック IBIT・フィデリティFBTC・アークビット等の比較、信託報酬0.25〜0.8%、日本での間接購入方法まで。",', 'description: "米国のビットコイン現物ETF（IBIT・FBTC等）の仕組み、日本居住者の購入可否、暗号資産取引所との違い、税金、信託報酬、リスクを整理。",'],
          ]) {
            guides = replaceOnce(guides, from, to, label);
          }

          fs.writeFileSync(guidePath, guide, 'utf8');
          fs.writeFileSync(guidesPath, guides, 'utf8');
          NODE
          node /tmp/codex-money-patch.js
          git diff --check
      - name: Verify
        shell: bash
        run: |
          npm ci
          npx tsc --noEmit --pretty false
          npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/codex-adsense-traffic-20260520.yml
          git add 'src/app/guide/[slug]/GuideContent.tsx' src/lib/guides.ts .github/workflows/codex-adsense-traffic-20260520.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: improve adsense traffic pages"
          git push origin master
