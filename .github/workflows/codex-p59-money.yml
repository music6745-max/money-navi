name: Codex P59 Money Patch
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/codex-p59-money.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply P59 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          base64 -d > /tmp/p59-money.patch <<'PATCH_B64'

PATCH_B64
          git apply --whitespace=fix /tmp/p59-money.patch
          rm -f .github/workflows/codex-p59-money.yml
          git add 'src/app/guide/[slug]/BasePage.tsx' 'src/app/guide/[slug]/contents/kaigo_part_06.tsx' 'src/app/guide/[slug]/page.tsx' 'src/app/guide/[slug]/supplementalGuides.ts' 'src/app/kaigo/page.tsx'
          git add -u .github/workflows/codex-p59-money.yml
          git commit -m "feat: add P59 window curtain screen guide"
          git push origin HEAD:master
