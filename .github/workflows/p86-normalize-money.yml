name: P86 normalize money source

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/p86-normalize-money.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'music6745-max/money-navi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize line endings and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ["src/app/kaigo/layout.tsx", "src/app/sitemap.ts"]:
              path = Path(name)
              data = path.read_bytes()
              path.write_bytes(data.replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
          Path(".github/workflows/p86-normalize-money.yml").unlink(missing_ok=True)
          PY
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/kaigo/layout.tsx src/app/sitemap.ts .github/workflows/p86-normalize-money.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: normalize P86 guide source"
            git push origin HEAD:master
          fi
