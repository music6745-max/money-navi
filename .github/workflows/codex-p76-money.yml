name: Codex P76 Money Patch
# trigger: 2026-06-01T17:10JST

on:
  push:
    paths:
      - ".github/workflows/codex-p76-money.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P76 money changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [System.Text.UTF8Encoding]::new($false)

          $layoutPath = 'src/app/kaigo/layout.tsx'
          $layout = [IO.File]::ReadAllText($layoutPath)
          if ($layout -notmatch 'id: "p76"') {
            $layoutInsert = @'
  {
    id: "p76",
    title: "高齢親の家の手ぬぐい・タオル・前掛け・布巾メモ",
    description:
      "手ぬぐい、タオル、前掛け、かっぽう着、布巾など、親の家で日々使ってきた洗える布ものを、処分や価値判断に使わず家族内の軽い控えとして整理します。",
    boothUrl:
      "https://kaigo-okane.booth.pm/items/8383392?utm_source=toshi-navi&utm_medium=hub&utm_campaign=kaigo_hub&utm_content=p76",
    guidePath: "/guide/parent-home-daily-cloth-items-record",
    toolUrl:
      "https://net-toolbox.jp/tools/kaigo-parent-home-daily-cloth-items-memo?utm_source=toshi-navi&utm_medium=hub&utm_campaign=kaigo_hub&utm_content=p76_tool",
  },
'@
            $layoutMarker = "const supplementalTemplates = [`n"
            if (-not $layout.Contains($layoutMarker)) { throw 'layout marker not found' }
            $layout = $layout.Replace($layoutMarker, $layoutMarker + $layoutInsert)
            [IO.File]::WriteAllText($layoutPath, $layout, $utf8)
          }

          $sitemapPath = 'src/app/sitemap.ts'
          $sitemap = [IO.File]::ReadAllText($sitemapPath)
          if ($sitemap -notmatch 'parent-home-daily-cloth-items-record') {
            $sitemapInsert = @'
    {
      url: `${base}/guide/parent-home-daily-cloth-items-record`,
      lastModified: now,
      changeFrequency: "monthly",
      priority: 0.5,
    },
'@
            $sitemapMarker = '    { url: `${base}/kaigo`, lastModified: now, changeFrequency: "weekly", priority: 0.95 },' + "`n"
            if (-not $sitemap.Contains($sitemapMarker)) { throw 'sitemap marker not found' }
            $sitemap = $sitemap.Replace($sitemapMarker, $sitemapMarker + $sitemapInsert)
            [IO.File]::WriteAllText($sitemapPath, $sitemap, $utf8)
          }

          $workflowPath = '.github/workflows/codex-p76-money.yml'
          if (Test-Path $workflowPath) { Remove-Item $workflowPath -Force }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/kaigo/layout.tsx src/app/sitemap.ts src/app/guide/parent-home-daily-cloth-items-record/page.tsx .github/workflows/codex-p76-money.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: connect P76 daily cloth guide'
            git push origin HEAD:master
          }
