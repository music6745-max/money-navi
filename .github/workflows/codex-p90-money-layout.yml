name: Codex P90 money layout patch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/codex-p90-money-layout.yml

permissions:
  contents: write

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Insert P90 hub card
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/app/kaigo/layout.tsx';
          let source = fs.readFileSync(path, 'utf8');
          if (source.includes('id: "p90"')) {
            console.log('P90 card already present');
          } else {
            const insert = `  {
    id: "p90",
    title: "高齢親の家のつり下げ飾りまわりメモ",
    description:
      "風鈴、つるし飾り、提灯、暖簾飾り、つるし雛など、天井や鴨居から吊り下げられていた飾りを、火気・取り付け・落下対策や処分判断とは分けて、家族内の呼び方・場所・見た目として控えます。",
    boothUrl:
      "https://kaigo-okane.booth.pm/items/8383446?utm_source=toshi-navi&utm_medium=hub&utm_campaign=kaigo_hub&utm_content=p90",
    guidePath: "/guide/parent-home-family-hanging-ornaments-record",
    toolUrl:
      "https://net-toolbox.jp/tools/kaigo-parent-home-family-hanging-ornaments-memo?utm_source=toshi-navi&utm_medium=hub&utm_campaign=kaigo_hub&utm_content=p90_tool",
  },
`;
            const crlfMarker = 'const supplementalTemplates: SupplementalTemplate[] = [\r\n';
            const lfMarker = 'const supplementalTemplates: SupplementalTemplate[] = [\n';
            if (source.includes(crlfMarker)) {
              source = source.replace(crlfMarker, 'const supplementalTemplates: SupplementalTemplate[] = [\n' + insert);
            } else if (source.includes(lfMarker)) {
              source = source.replace(lfMarker, lfMarker + insert);
            } else {
              throw new Error('supplementalTemplates marker not found');
            }
            fs.writeFileSync(path, source, 'utf8');
          }
          NODE
      - name: Commit patch
        run: |
          if git diff --quiet -- src/app/kaigo/layout.tsx; then
            echo "No layout change to commit"
            exit 0
          fi
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          git add src/app/kaigo/layout.tsx
          git commit -m "feat: add P90 hanging ornaments hub card"
          git push origin HEAD:master
