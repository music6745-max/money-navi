name: Codex P79 money patch

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/codex-p79-money.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply P79 money source and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def b64(value: str) -> bytes:
              return base64.b64decode(value.encode("ascii"))

          def insert_before(path: str, marker_lf: bytes, insert_lf: bytes) -> None:
              target = Path(path)
              data = target.read_bytes()
              if insert_lf.strip() in data or insert_lf.strip().replace(b"\n", b"\r\n") in data:
                  return
              marker_crlf = marker_lf.replace(b"\n", b"\r\n")
              if marker_lf in data:
                  target.write_bytes(data.replace(marker_lf, insert_lf + marker_lf, 1))
                  return
              if marker_crlf in data:
                  target.write_bytes(data.replace(marker_crlf, insert_lf.replace(b"\n", b"\r\n") + marker_crlf, 1))
                  return
              raise SystemExit(f"marker not found: {path}")

          page = Path("src/app/guide/parent-home-family-doors-sliding-screens-record/page.tsx")
          page.parent.mkdir(parents=True, exist_ok=True)
          page.write_bytes(b64(""))

          insert_before(
              "src/app/kaigo/layout.tsx",
              b'  {\n    id: "p78",',
              b64(""),
          )
          insert_before(
              "src/app/sitemap.ts",
              b'    {\n      url: `${base}/guide/parent-home-family-furniture-record`,',
              b64("ICAgIHsKICAgICAgdXJsOiBgJHtiYXNlfS9ndWlkZS9wYXJlbnQtaG9tZS1mYW1pbHktZG9vcnMtc2xpZGluZy1zY3JlZW5zLXJlY29yZGAsCiAgICAgIGxhc3RNb2RpZmllZDogbm93LAogICAgICBjaGFuZ2VGcmVxdWVuY3k6ICJtb250aGx5IiwKICAgICAgcHJpb3JpdHk6IDAuNSwKICAgIH0sCg=="),
          )
          Path(".github/workflows/codex-p79-money.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/guide/parent-home-family-doors-sliding-screens-record/page.tsx src/app/kaigo/layout.tsx src/app/sitemap.ts .github/workflows/codex-p79-money.yml
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "feat: connect P79 doors screens guide"
          git push origin HEAD:master
