name: Codex P114 money sync

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p114-money-sync.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P114 hub and sitemap entries
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const layoutPath = 'src/app/kaigo/layout.tsx';
          let layout = fs.readFileSync(layoutPath, 'utf8');
          if (!layout.includes('id: "p114"')) {
            const layoutSnippet = [
              '  {',
              '    id: "p114",',
              '    title: "高齢親の好きな食べ物・お菓子・飲み物メモ",',
              '    description:',
              '      "親が会話で話していた食べ物、お菓子、飲み物の好みを、食事判断や購入判断ではなく、家族内で会話前に見返す手がかりとして控えます。",',
              '    boothUrl:',
              '      "https://kaigo-okane.booth.pm/items/8383158?utm_source=toshi-navi&utm_medium=hub&utm_campaign=kaigo_hub&utm_content=p114",',
              '    guidePath: "/guide/parent-favorite-food-snacks-drinks-record",',
              '    toolUrl:',
              '      "https://net-toolbox.jp/tools/kaigo-parent-favorite-food-snacks-drinks-memo?utm_source=toshi-navi&utm_medium=hub&utm_campaign=kaigo_hub&utm_content=p114_tool",',
              '  },',
            ].join('\n');
            layout = layout.replace(
              /const supplementalTemplates: SupplementalTemplate\[\] = \[\r?\n/,
              (match) => match + layoutSnippet + '\n',
            );
            fs.writeFileSync(layoutPath, layout);
          }

          const sitemapPath = 'src/app/sitemap.ts';
          let sitemap = fs.readFileSync(sitemapPath, 'utf8');
          if (!sitemap.includes('parent-favorite-food-snacks-drinks-record')) {
            const sitemapSnippet = [
              '    {',
              '      url: `${base}/guide/parent-favorite-food-snacks-drinks-record`,',
              '      lastModified: now,',
              '      changeFrequency: "monthly",',
              '      priority: 0.5,',
              '    },',
            ].join('\n');
            sitemap = sitemap.replace(
              /\{ url: `\$\{base\}\/kaigo`, lastModified: now, changeFrequency: "weekly", priority: 0\.95 \},\r?\n/,
              (match) => match + sitemapSnippet + '\n',
            );
            fs.writeFileSync(sitemapPath, sitemap);
          }

          fs.rmSync('.github/workflows/codex-p114-money-sync.yml', { force: true });
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No P114 money changes to commit"
          else
            git commit -m "chore: sync P114 hub and sitemap"
            git push
          fi
