name: Codex P58 Money Distance Correction

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Add P58 to distance-care recommendations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = "src/lib/kaigoProducts.ts";
          let text = fs.readFileSync(path, "utf8");
          const start = text.indexOf('id: "distance"');
          if (start < 0) throw new Error("distance situation not found");
          const end = text.indexOf("nextActions:", start);
          if (end < 0) throw new Error("distance nextActions marker not found");
          let block = text.slice(start, end);
          if (!block.includes('"p58"')) {
            const search = 'productIds: ["p57", "p56",';
            const replacement = 'productIds: ["p58", "p57", "p56",';
            if (!block.includes(search)) throw new Error("distance productIds marker not found");
            block = block.replace(search, replacement);
            text = text.slice(0, start) + block + text.slice(end);
            fs.writeFileSync(path, text, "utf8");
          }
          NODE
          rm -f .github/workflows/codex-p58-money-distance-20260531.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add P58 to distance care recommendations"
          git push
