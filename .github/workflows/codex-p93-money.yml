name: Codex apply P93 money CTA patch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P93 patch and remove workflow
        shell: bash
        run: |
          cat > /tmp/p93-money.patch <<'PATCH'
diff --git a/src/app/guide/[slug]/contents/kaigo_part_01.tsx b/src/app/guide/[slug]/contents/kaigo_part_01.tsx
index 7b57e95..c15603a 100644
--- a/src/app/guide/[slug]/contents/kaigo_part_01.tsx
+++ b/src/app/guide/[slug]/contents/kaigo_part_01.tsx
@@ -2642,7 +2642,7 @@ export const guideContentsPart01: Record<string, ReactNode> = {
       <KaigoActionBox
         toolHref="https://net-toolbox.jp/tools/kaigo-care-certification-memo?utm_source=toshi-navi&utm_medium=guide&utm_campaign=care-certification-application-prep"
         toolLabel="申請前メモを作る"
-        boothHref="https://kaigo-okane.booth.pm/items/8407555"
+        boothHref="https://kaigo-okane.booth.pm/items/8407555?utm_source=toshi-navi&utm_medium=guide&utm_campaign=care-certification-application-prep&utm_content=single_template"
         boothLabel="申請前テンプレートを見る"
       >
         <p>
diff --git a/src/app/guide/[slug]/page.tsx b/src/app/guide/[slug]/page.tsx
index e4f8e30..a2292c5 100644
--- a/src/app/guide/[slug]/page.tsx
+++ b/src/app/guide/[slug]/page.tsx
@@ -174,6 +174,15 @@ const supplementalCtas: Record<
     icon: "BOOTH",
     highlight: "テンプレまとめ",
   },
+  "care-certification-application-prep": {
+    title: "介護のテンプレまとめ（フルパック）で申請前の整理もまとめて用意",
+    description:
+      "介護認定の申請前メモに加えて、通院、入退院、家族分担、費用、見守り連絡など、相談前に家族で見返しやすいテンプレートをまとめたセットです。必要なものから使えます。",
+    buttonText: "フルパックをBOOTHで見る",
+    href: "https://kaigo-okane.booth.pm/items/8383441?utm_source=toshi-navi&utm_medium=guide&utm_campaign=care-certification-application-prep&utm_content=full_pack",
+    icon: "BOOTH",
+    highlight: "テンプレまとめ",
+  },
 };
 
 export default async function GuidePage({ params }: GuidePageProps) {
diff --git a/src/app/kaigo/page.tsx b/src/app/kaigo/page.tsx
index 5cac993..36d6812 100644
--- a/src/app/kaigo/page.tsx
+++ b/src/app/kaigo/page.tsx
@@ -456,6 +456,16 @@ export default function KaigoPage() {
             >
               新着: 遠距離介護テンプレート
             </TrackedExternalLink>
+            <TrackedExternalLink
+              href="https://kaigo-okane.booth.pm/items/8407555"
+              eventName="booth_click"
+              page="kaigo"
+              position="intro_new_template"
+              itemId="p102"
+              className="block rounded-md border border-primary/30 bg-primary/5 px-3 py-2 text-sm font-bold text-primary hover:border-primary/60"
+            >
+              新着: 介護認定申請前テンプレート
+            </TrackedExternalLink>
             <TrackedExternalLink
               href="https://kaigo-okane.booth.pm/items/8409959"
               eventName="booth_click"
PATCH
          git apply --whitespace=nowarn /tmp/p93-money.patch
          git rm .github/workflows/codex-p93-money.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/kaigo/page.tsx src/app/guide/[slug]/contents/kaigo_part_01.tsx src/app/guide/[slug]/page.tsx
          git commit -m "feat: strengthen P93 certification prep CTAs"
          git push
