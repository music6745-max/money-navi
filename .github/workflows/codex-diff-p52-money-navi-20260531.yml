name: codex apply P52 money diff 20260531

on:
  push:
    paths:
      - '.github/codex-p52-money-diff-trigger.txt'

jobs:
  apply-p52-money-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P52 patch and remove temporary files
        run: |
          set -euo pipefail
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          git apply --index .github/codex-p52-money-diff.patch
          rm -f .github/codex-p52-money-diff.patch
          rm -f .github/codex-p52-money-diff-trigger.txt
          rm -f .github/codex-p52-money-script-trigger.txt
          rm -f .github/codex-p52-money-trigger.txt
          rm -f .github/workflows/codex-apply-p52-money-navi-20260531.yml
          rm -f .github/workflows/codex-trigger-p52-money-navi-20260531.yml
          rm -f .github/workflows/codex-script-p52-money-navi-20260531.yml
          rm -f .github/workflows/codex-diff-p52-money-navi-20260531.yml
          git add -A
          git commit -m "feat: connect P52 family history memo"
          git push
