name: Codex Apply P54 Money Patch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/codex-apply-p54-money.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply P54 money patch
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/p54.patch
          git apply --check /tmp/p54.patch
          git apply /tmp/p54.patch
          rm -f .github/workflows/codex-apply-p54-money.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: connect P54 photo album memo"
          git push origin HEAD:master
