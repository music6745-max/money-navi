name: codex-p64-money-trigger

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/codex-p64-money-trigger.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stored P64 patch
        shell: bash
        run: |
          set -euo pipefail
          awk '/cat > \/tmp\/p64-money\.patch <<'"'"'PATCH'"'"'/{flag=1; next} /^PATCH$/{flag=0} flag' .github/workflows/codex-p64-money.yml > /tmp/p64-money.patch
          test -s /tmp/p64-money.patch
          git apply /tmp/p64-money.patch
          rm -f .github/workflows/codex-p64-money.yml .github/workflows/codex-p64-money-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/guide/parent-speech-habit-phrases-record/page.tsx src/app/kaigo/layout.tsx src/app/sitemap.ts src/lib/kaigoProducts.ts .github/workflows/codex-p64-money.yml .github/workflows/codex-p64-money-trigger.yml
          git commit -m "feat: connect P64 speech phrase guide"
          git push
